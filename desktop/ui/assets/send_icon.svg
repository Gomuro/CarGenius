<?xml version="1.0" encoding="UTF-8"?>
<svg width="24px" height="24px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f8fafc;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
    <!-- Modern paper plane design -->
    <path d="M2.5,21.5L22.5,12L2.5,2.5L2.5,9.5L17,12L2.5,14.5L2.5,21.5Z" 
          fill="url(#sendGradient)" 
          filter="url(#glow)"
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="0.5"/>
    <!-- Accent line for modern look -->
    <path d="M2.5,12L17,12" 
          stroke="rgba(255,255,255,0.6)" 
          stroke-width="1" 
          stroke-linecap="round"/>
  </g>
</svg> 