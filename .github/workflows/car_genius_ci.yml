name: CarGenius CI

on:
  push:
    branches: [ serhiy ]
  pull_request:
    branches: [ serhiy ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379

    env:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
      DATABASE_URL: postgresql+asyncpg://fastapi_user:test@postgres_cargenius:5432/fastapi_project_db
      TEST_DATABASE_URL: postgresql+asyncpg://test_fastapi:test_fastapi@test_db:5432/test_cargenius_db
      test_database_url: postgresql+asyncpg://test_fastapi:test_fastapi@test_db:5432/test_cargenius_db
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      PYTHONPATH: /workdir_docker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          cd server
          alembic -c alembic_test.ini upgrade head

      - name: Run tests with coverage
        run: |
          cd server
          coverage run -m pytest
          coverage report
