name: CarGenius CI

on:
  push:
    branches: [ serhiy ]
  pull_request:
    branches: [ serhiy ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379

    env:
      # Параметри для тестової бази (мають відповідати налаштуванням сервісу postgres)
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
      # Саме цю змінну має використовувати ваш alembic/config/database.py/app!
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/testdb
      # Celery та інше
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      PYTHONPATH: /workdir_docker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h postgres -p 5432 -U testuser && break
            echo "Waiting for Postgres..."
            sleep 3
          done

      - name: Run Alembic migrations
        run: |
          cd server
          alembic -c alembic_test.ini upgrade head

      - name: Run tests with coverage
        run: |
          cd server
          coverage run -m pytest
          coverage report
